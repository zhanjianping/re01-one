<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气查询</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        .dropdown {
            position: absolute;
            width: 200px;
            background: white;
            border: 1px solid #ddd;
            max-height: 150px;
            overflow-y: auto;
        }
        .dropdown div {
            padding: 8px;
            cursor: pointer;
        }
        .dropdown div:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function WeatherApp() {
            const [city, setCity] = React.useState("");
            const [weather, setWeather] = React.useState(null);
            const [suggestions, setSuggestions] = React.useState([]);
            const [showDropdown, setShowDropdown] = React.useState(false);
            const API_KEY = "4f3f117c68e5482a83e3d53d57df9c73";

            // 监听输入，自动查询城市列表
            const fetchCitySuggestions = async (input) => {
                if (!input) {
                    setSuggestions([]);
                    return;
                }
                try {
                    const response = await fetch(
                        `https://geoapi.qweather.com/v2/city/lookup?location=${input}&key=${API_KEY}`
                    );
                    const data = await response.json();
                    if (data.code === "200") {
                        setSuggestions(data.location);
                        setShowDropdown(true);
                    }
                } catch (error) {
                    console.error("获取城市列表失败", error);
                }
            };

            // 选择城市后填充输入框
            const handleSelectCity = (selectedCity) => {
                setCity(selectedCity.name);
                setShowDropdown(false);
            };

            // 先获取城市 ID
            const fetchCityID = async () => {
                if (!city) {
                    alert("请输入城市名称");
                    return;
                }

                try {
                    const geoResponse = await fetch(
                        `https://geoapi.qweather.com/v2/city/lookup?location=${city}&key=${API_KEY}`
                    );
                    const geoData = await geoResponse.json();

                    if (geoData.code === "200" && geoData.location.length > 0) {
                        const cityID = geoData.location[0].id;
                        fetchWeather(cityID);
                    } else {
                        alert("未找到该城市，请输入正确的城市名称！");
                    }
                } catch (error) {
                    console.error("城市 ID 查询失败", error);
                }
            };

            // 再获取天气数据
            const fetchWeather = async (cityID) => {
                try {
                    const response = await fetch(
                        `https://devapi.qweather.com/v7/weather/now?location=${cityID}&key=${API_KEY}`
                    );
                    const data = await response.json();
                    setWeather(data);
                } catch (error) {
                    console.error("获取天气失败", error);
                }
            };

            return (
                <div style={{ textAlign: "center", padding: "20px" }}>
                    <h2>天气查询</h2>
                    <div style={{ position: "relative", display: "inline-block" }}>
                        <input
                            type="text"
                            placeholder="输入城市名称"
                            value={city}
                            onChange={(e) => {
                                setCity(e.target.value);
                                fetchCitySuggestions(e.target.value);
                            }}
                        />
                        {showDropdown && suggestions.length > 0 && (
                            <div className="dropdown">
                                {suggestions.map((item) => (
                                    <div key={item.id} onClick={() => handleSelectCity(item)}>
                                        {item.name} ({item.adm1} - {item.country})
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                    <button onClick={fetchCityID}>查询</button>

                    {weather && weather.now && (
                        <div>
                            <h3>{city} 的天气</h3>
                            <p>温度: {weather.now.temp}°C</p>
                            <p>天气: {weather.now.text}</p>
                            <p>风速: {weather.now.windSpeed} km/h</p>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<WeatherApp />);
    </script>
</body>
</html>
